<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Employer Registration | Job Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <a class="logo" href="index.html">JOB<span>TRACKER</span></a>
    <nav class="navigation" id="site-navigation" aria-label="Main navigation">
        <a href="index.html"><button class="nav-btn" type="button">Home</button></a>
        <a href="jobs.html"><button class="nav-btn" type="button">Jobs</button></a>
        <a href="matching.html"><button class="nav-btn" type="button">Matching</button></a>
        <a href="account.html"><button class="nav-btn" type="button">Account</button></a>
    </nav>
    <button class="menu-btn" type="button" aria-label="Open navigation" aria-controls="site-navigation" aria-expanded="false" onclick="toggleMenu()">☰</button>
</header>

<main class="page">
    <form class="form-card" method="post">
        <h1 class="form-title">Employer Registration</h1>
        <p class="form-description">Create your employer profile.</p>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="company-name">Company Name</label>
                <input class="form-input" type="text" id="company-name" name="company_name" placeholder="Company name" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="contact-person">Contact Person</label>
                <input class="form-input" type="text" id="contact-person" name="contact_person" placeholder="Contact person" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="employer-email">Email</label>
                <input class="form-input" type="email" id="employer-email" name="email" placeholder="Email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="employer-phone">Phone</label>
                <input class="form-input" type="tel" id="employer-phone" name="phone" placeholder="Phone number" autocomplete="tel">
            </div>

            <div class="form-group">
                <label class="form-label" for="industry">Industry</label>
                <input class="form-input" type="text" id="industry" name="industry" placeholder="Industry">
            </div>

            <div class="form-group">
                <label class="form-label" for="employer-location">Location</label>
                <input class="form-input" type="text" id="employer-location" name="location" placeholder="Location">
            </div>

            <div class="form-group">
                <label class="form-label" for="employer-password">Password</label>
                <div class="password-field">
                    <input class="form-input" type="password" id="employer-password" name="password" placeholder="Password" required autocomplete="new-password">
                    <button class="password-toggle" type="button" data-password-toggle="employer-password" aria-label="Show password" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="employer-confirm-password">Confirm Password</label>
                <div class="password-field">
                    <input class="form-input" type="password" id="employer-confirm-password" name="confirm_password" placeholder="Confirm password" required autocomplete="new-password">
                    <button class="password-toggle" type="button" data-password-toggle="employer-confirm-password" aria-label="Show password" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button class="submit-btn" type="submit">Create Employer Account</button>
            <a class="secondary-btn" href="login.html">Already Have an Account</a>
        </div>
    </form>
</main>

<footer class="footer">Job Tracker</footer>
<script src="script.js"></script>
</body>
</html>
