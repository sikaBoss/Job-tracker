<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Jobs | Job Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <a class="logo" href="index.html">JOB<span>TRACKER</span></a>
    <nav class="navigation" id="site-navigation" aria-label="Main navigation">
        <a href="index.html"><button class="nav-btn" type="button">Home</button></a>
        <a href="jobs.html"><button class="nav-btn" type="button">Jobs</button></a>
        <a href="matching.html"><button class="nav-btn" type="button">Matching</button></a>
        <a href="account.html"><button class="nav-btn" type="button">Account</button></a>
    </nav>
    <button class="menu-btn" type="button" aria-label="Open navigation" aria-controls="site-navigation" aria-expanded="false" onclick="toggleMenu()">☰</button>
</header>

<main class="page">
    <section class="section">
        <h1 class="page-title">Jobs</h1>
        <p class="page-subtitle">Search and view available opportunities. Job data will be supplied by the backend later.</p>

        <div class="search-bar">
            <input class="form-input" type="search" placeholder="Search jobs..." aria-label="Search jobs">
            <button class="primary-btn" type="button">Search</button>
        </div>

        <div class="empty-state">
            <h2>No jobs available</h2>
            <p>This area is ready for your backend to load job listings.</p>
        </div>
    </section>
</main>

<footer class="footer">Job Tracker</footer>
<script src="script.js"></script>
</body>
</html>
