<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Login | Job Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <a class="logo" href="index.html">JOB<span>TRACKER</span></a>
    <nav class="navigation" id="site-navigation" aria-label="Main navigation">
        <a href="index.html"><button class="nav-btn" type="button">Home</button></a>
        <a href="jobs.html"><button class="nav-btn" type="button">Jobs</button></a>
        <a href="matching.html"><button class="nav-btn" type="button">Matching</button></a>
        <a href="account.html"><button class="nav-btn" type="button">Account</button></a>
    </nav>
    <button class="menu-btn" type="button" aria-label="Open navigation" aria-controls="site-navigation" aria-expanded="false" onclick="toggleMenu()">☰</button>
</header>

<main class="page">
    <form class="form-card login-card" method="post">
        <h1 class="form-title">Login</h1>
        <p class="form-description">Enter your account details.</p>

        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-field">
                <input class="form-input" type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-actions">
            <button class="submit-btn" type="submit">Login</button>
            <a class="secondary-btn" href="account.html">Register Here</a>
        </div>
    </form>
</main>

<footer class="footer">Job Tracker</footer>
<script src="script.js"></script>
</body>
</html>
